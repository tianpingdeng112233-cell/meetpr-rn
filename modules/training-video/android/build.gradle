plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.meetpr.video'
version = '1.0.0'

android {
  namespace 'com.meetpr.video'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Matches the resolved app classpath (CameraX 1.6.0 / expo-camera 57.0.4).
  def media3Version = '1.9.0'
  implementation "androidx.media3:media3-common:${media3Version}"
  implementation "androidx.media3:media3-transformer:${media3Version}"
}
